name: CI

on:
  push:
    branches: [main, dev, "feat/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v7
      - name: Build ESP32 firmware
        run: idf.py set-target esp32 build
