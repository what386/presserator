name: Lint

on:
  push:
    branches: [main, dev, "feat/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          find main -name '*.cpp' -print0 | xargs -0 clang-format --dry-run --Werror
